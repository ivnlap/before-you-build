<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1C"/>
      <stop offset="1" stop-color="#161B36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6F432" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C6F432" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C6F432"/>
      <stop offset="1" stop-color="#E9FF9A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- ============ LEFT: the pile of ideas ============ -->
  <circle cx="430" cy="318" r="190" fill="url(#glow)"/>

  <!-- A: STOP -->
  <g transform="translate(58 58) rotate(-7)" filter="url(#shadow)">
    <rect width="224" height="150" rx="8" fill="#FDE68A"/>
    <text x="20" y="46" font-size="22" font-weight="600" fill="#2A2410">AI assistant</text>
    <text x="20" y="76" font-size="22" font-weight="600" fill="#2A2410">for dentists?</text>
    <g transform="translate(96 132) rotate(-8)" opacity="0.92">
      <rect x="-6" y="-34" width="112" height="46" rx="6" fill="none" stroke="#EF4444" stroke-width="4"/>
      <text x="50" y="0" font-size="28" font-weight="800" fill="#EF4444" text-anchor="middle" letter-spacing="3">STOP</text>
    </g>
  </g>

  <!-- B: STOP -->
  <g transform="translate(318 34) rotate(5)" filter="url(#shadow)">
    <rect width="224" height="150" rx="8" fill="#FBCFE8"/>
    <text x="20" y="46" font-size="22" font-weight="600" fill="#3A1328">Marketplace</text>
    <text x="20" y="76" font-size="22" font-weight="600" fill="#3A1328">for tutors</text>
    <g transform="translate(96 132) rotate(-8)" opacity="0.92">
      <rect x="-6" y="-34" width="112" height="46" rx="6" fill="none" stroke="#EF4444" stroke-width="4"/>
      <text x="50" y="0" font-size="28" font-weight="800" fill="#EF4444" text-anchor="middle" letter-spacing="3">STOP</text>
    </g>
  </g>

  <!-- C: TESTING -->
  <g transform="translate(46 252) rotate(4)" filter="url(#shadow)">
    <rect width="224" height="132" rx="8" fill="#BFDBFE"/>
    <text x="20" y="54" font-size="22" font-weight="600" fill="#0F2440">Meal-prep</text>
    <text x="20" y="84" font-size="22" font-weight="600" fill="#0F2440">subscription</text>
    <rect x="20" y="98" width="128" height="24" rx="12" fill="#1D4ED8"/>
    <text x="84" y="115" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TESTING · L2</text>
  </g>

  <!-- E: STOP -->
  <g transform="translate(60 452) rotate(-4)" filter="url(#shadow)">
    <rect width="224" height="150" rx="8" fill="#DDD6FE"/>
    <text x="20" y="46" font-size="22" font-weight="600" fill="#22184A">Newsletter</text>
    <text x="20" y="76" font-size="22" font-weight="600" fill="#22184A">about… stuff?</text>
    <g transform="translate(96 132) rotate(-8)" opacity="0.92">
      <rect x="-6" y="-34" width="112" height="46" rx="6" fill="none" stroke="#EF4444" stroke-width="4"/>
      <text x="50" y="0" font-size="28" font-weight="800" fill="#EF4444" text-anchor="middle" letter-spacing="3">STOP</text>
    </g>
  </g>

  <!-- F: CHANGE -->
  <g transform="translate(330 448) rotate(6)" filter="url(#shadow)">
    <rect width="224" height="150" rx="8" fill="#FED7AA"/>
    <text x="20" y="46" font-size="22" font-weight="600" fill="#3B1D06">SaaS for</text>
    <text x="20" y="76" font-size="22" font-weight="600" fill="#3B1D06">florists??</text>
    <g transform="translate(70 132) rotate(-7)" opacity="0.95">
      <rect x="-6" y="-34" width="146" height="46" rx="6" fill="none" stroke="#F59E0B" stroke-width="4"/>
      <text x="67" y="0" font-size="28" font-weight="800" fill="#D97706" text-anchor="middle" letter-spacing="3">CHANGE</text>
    </g>
  </g>

  <!-- D: CONTINUE (the one that survived) -->
  <g transform="translate(318 236) rotate(-3)" filter="url(#shadow)">
    <rect x="-4" y="-4" width="252" height="160" rx="11" fill="none" stroke="#C6F432" stroke-width="3"/>
    <rect width="244" height="152" rx="8" fill="#ECFCCB"/>
    <text x="20" y="50" font-size="22" font-weight="700" fill="#1A2E05">Courier payout</text>
    <text x="20" y="80" font-size="22" font-weight="700" fill="#1A2E05">reconciliation</text>
    <text x="20" y="104" font-size="14" font-weight="500" fill="#3F6212">3 of 6 agencies pre-paid</text>
    <rect x="20" y="116" width="150" height="26" rx="13" fill="#4D7C0F"/>
    <text x="95" y="134" font-size="14" font-weight="800" fill="#ECFCCB" text-anchor="middle" letter-spacing="1.5">CONTINUE · L5</text>
  </g>

  <!-- ============ RIGHT: the message ============ -->
  <text x="664" y="96" font-size="17" font-weight="700" fill="#C6F432" letter-spacing="4">BEFORE YOU BUILD</text>
  <text x="662" y="172" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Too many ideas.</text>
  <text x="662" y="244" font-size="64" font-weight="800" fill="#C6F432" letter-spacing="-1.5">Zero evidence.</text>

  <text x="664" y="296" font-size="22" font-weight="400" fill="#B4BCD4">Stop choosing by gut. Test every idea with</text>
  <text x="664" y="326" font-size="22" font-weight="400" fill="#B4BCD4">real people and let the evidence pick —</text>
  <text x="664" y="356" font-size="22" font-weight="600" fill="#FFFFFF">in days, not months.</text>

  <!-- evidence ladder -->
  <text x="664" y="410" font-size="13" font-weight="700" fill="#7F88A6" letter-spacing="2.5">THE EVIDENCE LADDER</text>
  <g font-size="15" font-weight="800" text-anchor="middle">
    <rect x="664"  y="510" width="74" height="16" rx="4" fill="#3A4160"/>
    <rect x="756"  y="494" width="74" height="32" rx="4" fill="#4E5781"/>
    <rect x="848"  y="478" width="74" height="48" rx="4" fill="#6B76A6"/>
    <rect x="940"  y="460" width="74" height="66" rx="4" fill="#9CB948"/>
    <rect x="1032" y="442" width="74" height="84" rx="4" fill="#B5DA3A"/>
    <rect x="1124" y="422" width="74" height="104" rx="4" fill="url(#bar)"/>
    <text x="701"  y="549" fill="#8A93B0">L0</text>
    <text x="793"  y="549" fill="#8A93B0">L1</text>
    <text x="885"  y="549" fill="#8A93B0">L2</text>
    <text x="977"  y="549" fill="#C6F432">L3</text>
    <text x="1069" y="549" fill="#C6F432">L4</text>
    <text x="1161" y="549" fill="#C6F432">L5</text>
  </g>
  <g font-size="12.5" font-weight="500" fill="#8A93B0" text-anchor="middle">
    <text x="701"  y="568">“I’d use it”</text>
    <text x="793"  y="568">past story</text>
    <text x="885"  y="568">workaround</text>
    <text x="977"  y="568">clicked</text>
    <text x="1069" y="568">committed</text>
    <text x="1161" y="568">paid</text>
  </g>

  <text x="664" y="612" font-size="15" font-weight="500" fill="#7F88A6">7 open-source AI skills · for founders &amp; small teams without a PM</text>
</svg>
